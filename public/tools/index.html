<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="刘贺的小工具：轻量、独立加载的日常工具，支持按分类和关键词查找。">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>小工具 · 刘贺</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./catalog.js" defer></script>
</head>
<body>
  <main>
    <nav aria-label="导航"><a class="brand" href="/tools/">刘贺的小工具</a><a href="/">技术博客 ↗</a></nav>
    <header><h1>日常工具，打开就用。</h1><p>把重复的小事交给工具，留点时间处理真正的问题。</p></header>
    <section class="finder" aria-label="查找工具">
      <label for="search">找个工具</label>
      <input id="search" type="search" placeholder="搜索名称或用途，例如 JSON、日志、中文…" autocomplete="off" spellcheck="false">
      <div class="filter-row"><div id="categories" aria-label="工具分类"><button type="button" data-category="" aria-pressed="true">全部</button></div><span id="count" role="status" aria-live="polite">1 个工具</span></div>
    </section>
    <section class="cards" aria-label="工具列表">
      <a class="tool" href="./nginx-decoder/" data-category="日志与编码" data-keywords="nginx x22 utf8 utf-8 json decode request_body 转义 中文 编码">
        <div class="tool-top"><span class="icon" aria-hidden="true">{ }</span><span class="tag">日志与编码</span></div>
        <h2>日志解码<span aria-hidden="true">↗</span></h2>
        <p>还原 Nginx 的 \x22、UTF-8 中文和多层 JSON。粘贴后自动解码，支持复制和下载。</p>
        <div class="tool-foot"><span>本地处理</span><span>无依赖</span></div>
      </a>
    </section>
    <div id="empty" hidden><h2>没有找到匹配的工具</h2><p>换个关键词，或清除筛选查看全部工具。</p><button id="reset" type="button">清除筛选</button></div>
    <footer><span>各工具独立加载，按需打开。</span><a href="https://github.com/liuhedev/liuhedev.github.io/tree/main/public/tools" target="_blank" rel="noopener noreferrer">查看源码 ↗</a></footer>
  </main>
</body>
</html>
